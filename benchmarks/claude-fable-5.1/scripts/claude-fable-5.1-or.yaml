# Model manifest: Claude Fable 5.1 (OpenRouter)
# Cloud-hosted, OpenAI-compatible API via OpenRouter
# 1M context, text+image+file in, text out. Reasoning params exist but
# Official A runs thinking-off; smoke tests return content with 0 reasoning tokens.

model_id: "claude-fable-5.1-or"
name: "Claude Fable 5.1"
provider: "anthropic"
served_name: "anthropic/claude-fable-5.1"

input_modalities:
  - text
  - image_in

output_modalities:
  - text

capabilities:
  - reasoning
  - coding
  - writing
  - tool_calling
  - vision
  - context_long
  - streaming

context_length: 1000000
max_output_tokens: 128000

metadata:
  endpoint: "https://openrouter.ai/api/v1"
  engine: "OpenRouter"
  engine_version: "cloud"
  quantization: "none"
  tool_call_parser: "native"
  released: "2026-09-01"
