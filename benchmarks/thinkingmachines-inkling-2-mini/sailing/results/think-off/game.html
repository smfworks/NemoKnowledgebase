<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bay Sail</title>
<style>
  body { margin:0; background:#0b2233; color:#eaf6ff; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; text-align:center; padding:14px 10px; }
  h1 { font-size:22px; line-height:1.2; margin:0 0 6px; font-weight:700; }
  .controls { margin:0 0 10px; font-size:14px; color:#cfe8f5; }
  canvas { background:#123a4d; border:1px solid #2c4b5f; border-radius:8px; max-width:100%; height:auto; box-shadow:0 10px 30px rgba(0,0,0,.35); }
</style>
</head>
<body>
<h1>Bay Sail</h1>
<p class="controls">Controls: Left / Right arrow keys turn the boat. Wind blows from the north.</p>
<canvas id="game" width="1000" height="700"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const noGo = 40 * Math.PI / 180;
  const maxSpeed = 155;
  const turnRate = 1.9;
  const margin = 46;

  const marks = [
    { id:'start', x:500, y:600, r:18, label:'Start' },
    { id:1, x:180, y:430, r:20, label:'1' },
    { id:2, x:820, y:330, r:20, label:'2' },
    { id:3, x:500, y:150, r:20, label:'3' }
  ];
  const byId = Object.fromEntries(marks.map(m => [m.id, m]));
  const course = [1, 2, 3, 'start'];

  const boat = { x:500, y:600, heading:-1.0 };
  let courseIndex = 0;
  let finished = false;
  let startTime = performance.now();
  let finishTime = 0;
  let currentSpeed = 0;
  let currentAngle = 0;

  const keys = { left:false, right:false };
  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') { keys.left = true; e.preventDefault(); }
    if (e.key === 'ArrowRight') { keys.right = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') { keys.left = false; e.preventDefault(); }
    if (e.key === 'ArrowRight') { keys.right = false; e.preventDefault(); }
  });

  const ripples = Array.from({ length:70 }, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    w: 18 + Math.random()*46,
    a: 0.05 + Math.random()*0.10
  }));
  const windMarks = Array.from({ length:85 }, () => ({
    x: Math.random()*W,
    y: Math.random()*H,
    len: 12 + Math.random()*16,
    v: 55 + Math.random()*55,
    a: 0.18 + Math.random()*0.28
  }));

  function normAngle(a) { return Math.atan2(Math.sin(a), Math.cos(a)); }

  function update(dt, now) {
    for (const w of windMarks) {
      w.y += w.v * dt;
      w.x += Math.sin((w.y + w.x) * 0.01) * 8 * dt;
      if (w.y > H + 24) { w.y = -24; w.x = Math.random()*W; }
    }

    if (finished) {
      currentSpeed = 0;
      return;
    }

    if (keys.left) boat.heading -= turnRate * dt;
    if (keys.right) boat.heading += turnRate * dt;
    boat.heading = normAngle(boat.heading);

    currentAngle = Math.abs(boat.heading);
    currentSpeed = currentAngle < noGo ? 0 : maxSpeed * Math.max(Math.sin(currentAngle), 0.35);

    boat.x += Math.sin(boat.heading) * currentSpeed * dt;
    boat.y += -Math.cos(boat.heading) * currentSpeed * dt;
    boat.x = Math.max(margin, Math.min(W - margin, boat.x));
    boat.y = Math.max(margin, Math.min(H - margin, boat.y));

    const target = byId[course[courseIndex]];
    const d = Math.hypot(boat.x - target.x, boat.y - target.y);
    if (d < target.r + 10) {
      courseIndex++;
      if (courseIndex >= course.length) {
        finished = true;
        finishTime = (now - startTime) / 1000;
      }
    }
  }

  function drawWater() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1f6d86');
    g.addColorStop(0.55, '#155a73');
    g.addColorStop(1, '#0d3d57');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.lineWidth = 2;
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(255,255,255,${r.a})`;
      ctx.beginPath();
      ctx.moveTo(r.x - r.w/2, r.y);
      ctx.quadraticCurveTo(r.x, r.y - 4, r.x + r.w/2, r.y);
      ctx.stroke();
    }
  }

  function drawLand() {
    ctx.fillStyle = '#c8b77e';
    ctx.fillRect(0, H - 34, W, 34);
    ctx.fillRect(0, 0, 34, H);
    ctx.fillRect(W - 34, 0, 34, H);
    ctx.fillStyle = '#6f9a5a';
    ctx.fillRect(0, H - 40, W, 8);
    ctx.fillRect(30, 0, 8, H);
    ctx.fillRect(W - 38, 0, 8, H);
  }

  function drawWind() {
    ctx.lineCap = 'round';
    ctx.lineWidth = 2;
    for (const w of windMarks) {
      ctx.strokeStyle = `rgba(235,250,255,${w.a})`;
      ctx.beginPath();
      ctx.moveTo(w.x, w.y);
      ctx.lineTo(w.x, w.y + w.len);
      ctx.stroke();
    }
  }

  function drawMark(m, isTarget, now) {
    if (isTarget) {
      const pulse = 1 + 0.18 * Math.sin(now / 180);
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y, (m.r + 12) * pulse, 0, Math.PI * 2);
      ctx.stroke();
    }

    if (m.id === 'start') {
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111827';
      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('S', m.x, m.y + 1);
    } else {
      ctx.fillStyle = '#ff7a1a';
      ctx.strokeStyle = '#fff7ed';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(m.id), m.x, m.y + 1);
    }
  }

  function drawBoat() {
    ctx.save();
    ctx.translate(boat.x, boat.y);
    ctx.rotate(boat.heading);

    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(3, 5, 12, 30, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f4f1e8';
    ctx.strokeStyle = '#263238';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -30);
    ctx.quadraticCurveTo(13, -8, 11, 12);
    ctx.quadraticCurveTo(8, 28, 0, 30);
    ctx.quadraticCurveTo(-8, 28, -11, 12);
    ctx.quadraticCurveTo(-13, -8, 0, -30);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#dbeafe';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -20);
    ctx.lineTo(0, 22);
    ctx.lineTo(17, 14);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#263238';
    ctx.beginPath();
    ctx.arc(0, 0, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawHUD(now) {
    const elapsed = finished ? finishTime : (now - startTime) / 1000;
    const target = finished ? null : byId[course[courseIndex]];
    const targetText = finished ? 'Finished' : (target.id === 'start' ? 'Start' : `Buoy ${target.id}`);

    ctx.save();
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 20px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(12, 12, 310, 64);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Next: ${targetText}`, 24, 22);
    ctx.font = '17px system-ui, sans-serif';
    ctx.fillText(`Time: ${elapsed.toFixed(1)} s`, 24, 48);

    if (!finished && currentAngle < noGo) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 22px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(W/2 - 250, H - 78, 500, 38);
      ctx.fillStyle = '#ffe08a';
      ctx.fillText('In irons — turn away from the wind', W/2, H - 70);
    }

    if (finished) {
      ctx.textAlign = 'center';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.fillRect(W/2 - 230, H/2 - 48, 460, 96);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('Course complete', W/2, H/2 - 24);
      ctx.font = '20px system-ui, sans-serif';
      ctx.fillText(`Final time: ${elapsed.toFixed(1)} s`, W/2, H/2 + 12);
    }
    ctx.restore();
  }

  function draw(now) {
    drawWater();
    drawWind();
    drawLand();

    const target = finished ? null : byId[course[courseIndex]];
    if (target) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.20)';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 12]);
      ctx.beginPath();
      ctx.moveTo(boat.x, boat.y);
      ctx.lineTo(target.x, target.y);
      ctx.stroke();
      ctx.restore();
    }

    for (const m of marks) drawMark(m, target && m.id === target.id, now);
    drawBoat();
    drawHUD(now);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt, now);
    draw(now);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
