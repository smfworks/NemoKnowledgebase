# Model manifest: Mistral Large 4.0 (OpenRouter)
# Cloud-hosted. Official A ranking is text-only.
# Smoke (2026-10-01): 2+2 default and enable_thinking=false still think
# (29 reasoning tokens). reasoning.effort=none lands "4" with
# reasoning_tokens=0. Exact slug in run_stage1.py. Do NOT add
# mistral-large-4 to reasoning_indicators.

model_id: "mistral-large-4-0-or"
name: "Mistral Large 4.0"
provider: "mistralai"

input_modalities:
  - text

output_modalities:
  - text

capabilities:
  - reasoning
  - coding
  - writing
  - tool_calling
  - context_long
  - streaming

context_length: 524288
max_output_tokens: 1024

served_name: "mistralai/mistral-large-4-0"

metadata:
  endpoint: "https://openrouter.ai/api/v1"
  engine: "OpenRouter"
  engine_version: "cloud"
  quantization: "none"
  tool_call_parser: "native"
  reasoning_model: false
  reasoning_mandatory: false
  thinking_off_analogue: "reasoning.effort=none"
  claimed_input_modalities: ["text", "image"]
  pricing_per_token: "0.00000068/0.00000209"
  serve_recipe_id: "OpenRouter-cloud"
