# Model manifest: StepFun Step 5 Preview (OpenRouter)
# Cloud-hosted. Official A ranking is text-only even though the card
# claims image+video input.
# Smoke (2026-10-10): reasoning.mandatory=true. effort=none and
# enabled=false → HTTP 400. Default and enable_thinking=false still
# think (44 reasoning tokens on 2+2, content "4"). effort=low and
# effort=minimal both land "4" with 26 reasoning tokens. Official A
# analogue is reasoning.effort=low (catalog supported effort). Exact
# slug in run_stage1.py. Do NOT add stepfun/step to reasoning_indicators.

model_id: "step-5-preview-or"
name: "Step 5 Preview"
provider: "stepfun"

input_modalities:
  - text

output_modalities:
  - text

capabilities:
  - reasoning
  - coding
  - writing
  - tool_calling
  - context_long
  - streaming

context_length: 1000000
max_output_tokens: 1024

served_name: "stepfun/step-5-preview"

metadata:
  endpoint: "https://openrouter.ai/api/v1"
  engine: "OpenRouter"
  engine_version: "cloud"
  quantization: "none"
  tool_call_parser: "native"
  reasoning_model: false
  reasoning_mandatory: true
  thinking_off_analogue: "reasoning.effort=low"
  claimed_input_modalities: ["text", "image", "video"]
  active_params: "27B"
  total_params: "600B"
  pricing_per_token: "0.000001/0.0000027"
  canonical_slug: "stepfun/step-5-preview-20261008"
  serve_recipe_id: "OpenRouter-cloud"
